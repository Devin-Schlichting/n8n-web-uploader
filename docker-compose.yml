services:
  n8n-upload-gateway:
    build: .
    container_name: n8n-upload-gateway
    restart: unless-stopped
    ports:
      # Host-Port kommt aus PORT in der .env, im Container läuft die App immer auf 3000
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
    # Damit N8N_WEBHOOK_URL=http://host.docker.internal:5678/... auch unter Linux
    # den Docker-Host erreicht (z.B. wenn n8n dort auf Port 5678 veröffentlicht ist)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Falls dieser Service im selben Docker-Netzwerk wie dein n8n-Stack laufen soll,
    # damit N8N_WEBHOOK_URL z.B. http://n8n:5678/webhook/upload verwenden kann:
    # networks:
    #   - n8n-heimserver-docker_default

# networks:
#   n8n-heimserver-docker_default:
#     external: true
